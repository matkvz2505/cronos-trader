# =============================================================================
# LiteLLM — gateway de LLM do cronos-trader.
#
# Endpoint OpenAI-compatível na :4000 (publicada em :4010), na frente do OpenRouter.
# Os agentes chamam ESTE proxy, nunca o provedor: trocar de modelo é editar YAML.
#
# **Sem Claude.** Toda a cadeia roda pelo OpenRouter com a chave já configurada.
#
# ## Por que o principal NÃO é mais um modelo gratuito
#
# A configuração anterior usava `llama-3.3-70b:free` como principal, e a queixa era
# justa: modelo fraco. Os IDs foram conferidos contra a API da conta, e o quadro mudou.
#
# `gpt-5.6-luna-pro` custa **$0,10 por milhão de tokens de entrada** — mais barato que o
# gpt-4o-mini ($0,15) e com 1 milhão de tokens de contexto. Para o volume deste produto,
# que é de algumas análises por pregão, isso é fração de centavo por dia.
#
# Economizar isso ao custo de um modelo ruim analisando o trade é a troca errada. O
# gratuito continua na cadeia — mas como reserva, não como principal.
# =============================================================================

model_list:
  # ---------------------------------------------------------------------------
  # PRINCIPAL — o cavalo de batalha. Barato o bastante para ser default.
  # ---------------------------------------------------------------------------
  - model_name: principal
    litellm_params:
      model: openrouter/openai/gpt-5.6-luna-pro
      api_key: os.environ/OPENROUTER_API_KEY

  # ---------------------------------------------------------------------------
  # FORTE — raciocínio pesado. Só onde a qualidade muda a decisão.
  #
  # No cronos-trader isso é UM lugar: o Analista escrevendo a leitura de um sinal que
  # o usuário vai operar. O Crítico e o Gestor de Risco rodam no principal — as tarefas
  # deles são estruturadas, e estrutura modelo médio faz bem.
  # ---------------------------------------------------------------------------
  - model_name: forte
    litellm_params:
      model: openrouter/openai/gpt-5.6-terra
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: forte-reserva
    litellm_params:
      model: openrouter/google/gemini-2.5-flash
      api_key: os.environ/OPENROUTER_API_KEY

  # ---------------------------------------------------------------------------
  # RÁPIDO — tarefas mecânicas: classificar, extrair campo, resumir em uma linha.
  #
  # **Não use modelo de raciocínio aqui.** O `qwen3-32b` estava neste slot e gastou 183
  # tokens *pensando* para responder "OK" — o pensamento consome o orçamento antes de
  # sobrar conteúdo, e com `max_tokens` apertado a resposta volta vazia. Foi exatamente
  # o que aconteceu no primeiro teste deste gateway.
  #
  # Para tarefa mecânica o que se quer é resposta direta: mais rápida, mais barata por
  # token útil, e sem o risco de estourar o limite antes de produzir saída.
  # ---------------------------------------------------------------------------
  - model_name: rapido
    litellm_params:
      model: openrouter/openai/gpt-5.6-luna
      api_key: os.environ/OPENROUTER_API_KEY

  # ---------------------------------------------------------------------------
  # GRATUITOS — reserva, não principal.
  #
  # Nomes neutros de propósito: os `:free` rotacionam, esgotam capacidade e às vezes
  # somem. Trocar qual está por trás não pode exigir mexer no código dos agentes.
  #
  # O ultra de 550B com 1M de contexto é incomparavelmente melhor que o llama-3.3-70b
  # que estava aqui antes — vale como rede de segurança de verdade.
  # ---------------------------------------------------------------------------
  - model_name: free-primary
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: free-reserva
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_API_KEY

router_settings:
  # Um retry só: timeout não deve re-chamar um modelo caro três vezes.
  num_retries: 1

  # A cadeia degrada para modelos de custo semelhante ou menor, nunca para um
  # substancialmente pior sem tentar antes um equivalente.
  fallbacks:
    - principal: ['forte-reserva', 'free-primary']
    - forte: ['principal', 'forte-reserva']
    - forte-reserva: ['principal']
    - rapido: ['principal', 'free-reserva']
    - free-primary: ['free-reserva', 'principal']

  # Pedido que não cabe na janela vai para o próximo em vez de falhar. O dossiê de um
  # sinal com a knowledge base inteira no system prompt é grande — e os modelos de 1M
  # de contexto existem justamente para isso.
  context_window_fallbacks:
    - rapido: ['principal']
    - free-reserva: ['free-primary']

litellm_settings:
  drop_params: true
  request_timeout: 600

  success_callback: ['langfuse']
  failure_callback: ['langfuse']

  # Cache semântico DESLIGADO, e não é preguiça. Com system prompt grande — e o do
  # Analista carrega a knowledge base do ebook inteira — o embedding é dominado pelo
  # prompt, e perguntas diferentes colidem acima do limiar. O agente passa a responder
  # sempre a mesma coisa, em silêncio. O risco não compensa o centavo economizado.
  cache: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

  # A Admin UI e o registro de gastos exigem banco. Sem `database_url` a UI devolve
  # "Authentication Error, Not connected to DB!" no login — que é exatamente o erro que
  # aparecia aqui antes.
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  store_prompts_in_spend_logs: true
