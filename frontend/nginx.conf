server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets do Vite têm hash no nome — podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index nunca é cacheado: é ele que aponta para os assets novos depois de um deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://backend:1840;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Backtest sobre série longa passa fácil do minuto; o default de 60s cortaria a
        # requisição no meio e a tela mostraria erro de rede num processo que estava
        # rodando normalmente.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws {
        proxy_pass http://backend:1840;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # Conexão de sinais ao vivo fica ociosa entre um candle e outro; sem o timeout
        # longo, o nginx a derrubaria e o cliente reconectaria em loop.
        proxy_read_timeout 3600s;
    }

    # SPA: qualquer rota desconhecida devolve o index e o React Router resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
